<div id="step-symbols-section" class="card bg-base-100 shadow">
    <div class="card-body">
        <h2 class="card-title text-lg">Changed Symbols</h2>
        <div class="overflow-x-auto mt-2">
            <table class="table table-sm">
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Kind</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody>
                    {% for symbol in symbols %}
                    <tr>
                        <td class="font-mono text-sm">{{ symbol.name }}</td>
                        <td><span class="badge badge-outline badge-sm">{{ symbol.kind }}</span></td>
                        <td class="text-sm">{{ symbol.description }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
