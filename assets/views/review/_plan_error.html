<div id="start-review-area" class="mt-6">
    <div class="alert alert-error" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z" />
        </svg>
        <span>{{ error }}</span>
    </div>
    <div class="flex gap-2 mt-3">
        <button hx-post="/review/{{ session_id }}/guide/start"
                hx-target="#start-review-area"
                hx-swap="outerHTML"
                hx-indicator="#plan-retry-spinner"
                class="btn btn-outline">
            <span id="plan-retry-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
            Retry
        </button>
        <button hx-post="/review/{{ session_id }}/guide/plan/skip"
                hx-target="#start-review-area"
                hx-swap="outerHTML"
                class="btn btn-ghost">
            Skip (file-by-file)
        </button>
    </div>
</div>
