<details class="bg-base-200 rounded-lg group opacity-60">
    <summary class="flex items-center gap-2 px-4 py-2 cursor-pointer select-none font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 transition-transform group-open:rotate-90" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
        <span class="font-mono text-sm">{{ file_path }}</span>
        <span class="badge badge-success badge-xs ml-auto">✓ Validated</span>
    </summary>
    <div class="px-4 pb-3">
        <div class="diff-file-container" data-diff="{{ file_diff | json_encode() }}"></div>
    </div>
</details>

<span id="file-progress" hx-swap-oob="true">{{ validated_file_count }}/{{ total_file_count }}</span>

<div id="step-nav" hx-swap-oob="true" class="flex gap-2 items-center">
    {% if current_step_validated %}
    <span class="badge badge-success badge-lg gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
        All files validated
    </span>
    {% endif %}

    {% if step_number < total_steps %}
    <a href="/review/{{ session_id }}/guide/step/{{ step_number + 1 }}"
       class="btn btn-primary btn-sm {% if not current_step_validated %}btn-disabled{% endif %}">
        Next Step &rarr;
    </a>
    {% else %}
    <a href="/review/{{ session_id }}/summary"
       class="btn btn-primary btn-sm {% if not current_step_validated %}btn-disabled{% endif %}">
        Back to Summary
    </a>
    {% endif %}
</div>

<script>
(function() {
    var el = document.currentScript.parentElement.querySelector('details .diff-file-container');
    if (el) {
        var diffString = JSON.parse(el.getAttribute('data-diff'));
        if (diffString && diffString.trim()) {
            el.innerHTML = Diff2Html.html(diffString, {
                drawFileList: false, matching: 'lines',
                outputFormat: 'line-by-line', colorScheme: 'dark'
            });
        }
    }
})();
</script>
