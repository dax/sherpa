<div id="{{ section_id }}-section" class="card bg-base-100 shadow border border-error/30">
    <div class="card-body">
        <h2 class="card-title text-lg">{{ title }}</h2>
        <div class="alert alert-error mt-2" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M12 2a10 10 0 100 20 10 10 0 000-20z" />
            </svg>
            <span>{{ error }}</span>
        </div>
        <div class="flex gap-2 mt-3">
            <button hx-get="{{ retry_url }}"
                    hx-target="#{{ section_id }}-section"
                    hx-swap="outerHTML"
                    hx-indicator="#{{ section_id }}-retry-spinner"
                    class="btn btn-sm btn-outline">
                <span id="{{ section_id }}-retry-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
                Retry
            </button>
            <button hx-get="{{ skip_url | default(value='/review/' ~ session_id ~ '/summary/skip/' ~ section_id) }}"
                    hx-target="#{{ section_id }}-section"
                    hx-swap="outerHTML"
                    class="btn btn-sm btn-ghost">
                Skip
            </button>
        </div>
    </div>
</div>
