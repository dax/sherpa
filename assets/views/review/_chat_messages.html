{% for msg in messages %}
<div class="{% if msg.role == 'user' %}chat chat-end{% else %}chat chat-start{% endif %}">
    <div class="chat-bubble {% if msg.role == 'user' %}chat-bubble-primary{% else %}chat-bubble-secondary{% endif %}">
        {{ msg.content | safe }}
    </div>
    <div class="chat-footer text-xs text-base-content/50">{{ msg.timestamp }}</div>
</div>
{% endfor %}
