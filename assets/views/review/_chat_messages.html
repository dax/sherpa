{% for msg in messages %}
<div class="{% if msg.role == 'user' %}chat chat-sender{% else %}chat chat-receiver{% endif %}">
    <div class="chat-header text-xs text-base-content/50 mb-0.5">
        {% if msg.role == 'user' %}You{% else %}Sherpa AI{% endif %}
    </div>
    <div class="chat-bubble">
        {% if msg.role == 'user' %}
        {{ msg.content | safe }}
        {% else %}
        <div class="prose max-w-none">{{ msg.content | safe }}</div>
        {% endif %}
    </div>
    <div class="chat-footer text-xs text-base-content/50">{{ msg.timestamp }}</div>
</div>
{% endfor %}
