<div class="alert alert-success mt-4" role="alert">
    <svg xmlns="http://www.w3.org/2000/svg" class="shrink-0 size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span>Repository analyzed successfully</span>
</div>

<div class="mt-4 space-y-2 text-sm">
    <div class="flex justify-between">
        <span class="text-base-content/70">Branch</span>
        <span class="font-semibold font-mono">{{ branch }}</span>
    </div>
    <div class="flex justify-between">
        <span class="text-base-content/70">Default Branch</span>
        <span class="font-semibold font-mono">{{ default_branch }}</span>
    </div>
    <div class="flex justify-between">
        <span class="text-base-content/70">Changed Files</span>
        <span class="font-semibold">{{ changed_files_count }}</span>
    </div>
    <div class="flex justify-between">
        <span class="text-base-content/70">Merge Base</span>
        <span class="font-semibold font-mono">{{ merge_base }}</span>
    </div>
</div>

<input type="hidden" name="session_id" value="{{ session_id }}" data-session-id="{{ session_id }}" />

<div class="mt-6">
    <a href="/review/{{ session_id }}/summary" class="btn btn-primary w-full">
        Continue to Summary
    </a>
</div>
