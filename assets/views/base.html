<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sherpa{% endblock %}</title>

    <!-- Tailwind CSS + FlyonUI (local build) -->
    <link href="/static/css/app.css" rel="stylesheet">

    <!-- diff2html CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3.4.56/bundles/css/diff2html.min.css">

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200">
    {% block content %}{% endblock %}

    <!-- HTMX -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>

    <!-- FlyonUI JavaScript -->
    <script src="/static/js/flyonui.js"></script>

    <!-- diff2html JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.56/bundles/js/diff2html.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff2html@3.4.56/bundles/js/diff2html-ui.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
