<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sherpa{% endblock %}</title>

    <!-- Tailwind CSS + FlyonUI (local build) -->
    <link href="/static/css/app.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/diff2html.min.css">
    <link rel="stylesheet" href="/static/css/github-dark.min.css">

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200">
    {% block navbar %}{% endblock %}
    {% block content %}{% endblock %}

    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/flyonui.js"></script>
    <script src="/static/js/diff2html.min.js"></script>
    <script src="/static/js/diff2html-ui.min.js"></script>
    <script src="/static/js/highlight.min.js"></script>
    <script>
    hljs.highlightAll();
    document.body.addEventListener('htmx:afterSwap', function() {
        hljs.highlightAll();
        enhanceAnalysisBlocks();
    });

    function enhanceAnalysisBlocks() {
        var labels = {
            'What': '📋',
            'Why': '💡',
            'Key details': '🔍',
            'Key Details': '🔍',
            'How': '⚙️',
            'Impact': '⚡',
            'Concern': '⚠️',
            'Concerns': '⚠️',
            'Note': '📝',
            'Notes': '📝'
        };
        document.querySelectorAll('.prose p > strong:first-child, .prose li > strong:first-child').forEach(function(el) {
            if (el.dataset.enhanced) return;
            var text = el.textContent.trim().replace(/:$/, '');
            if (labels[text]) {
                el.dataset.enhanced = 'true';
                el.textContent = labels[text] + ' ' + el.textContent;
                el.closest('p, li').classList.add('analysis-label-block');
            }
        });
    }
    enhanceAnalysisBlocks();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
