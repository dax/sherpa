<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sherpa{% endblock %}</title>

    <!-- Tailwind CSS + FlyonUI (local build) -->
    <link href="/static/css/app.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/diff2html.min.css">
    <link rel="stylesheet" href="/static/css/github-dark.min.css">

    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200">
    {% block navbar %}{% endblock %}
    {% block content %}{% endblock %}

    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/flyonui.js"></script>
    <script src="/static/js/diff2html.min.js"></script>
    <script src="/static/js/diff2html-ui.min.js"></script>
    <script src="/static/js/highlight.min.js"></script>
    <script>
    hljs.highlightAll();
    document.body.addEventListener('htmx:afterSwap', function() {
        hljs.highlightAll();
        enhanceAnalysisBlocks();
    });

    function enhanceAnalysisBlocks() {
        var labels = {
            'What': '📋',
            'Why': '💡',
            'Key details': '🔍',
            'Key Details': '🔍',
            'How': '⚙️',
            'Impact': '⚡',
            'Concern': '⚠️',
            'Concerns': '⚠️',
            'Note': '📝',
            'Notes': '📝'
        };
        document.querySelectorAll('.prose p > strong:first-child, .prose li > strong:first-child').forEach(function(el) {
            if (el.dataset.enhanced) return;
            var text = el.textContent.trim().replace(/:$/, '');
            if (labels[text]) {
                el.dataset.enhanced = 'true';
                el.textContent = labels[text] + ' ' + el.textContent;
                var block = el.closest('p, li');
                var next = block.nextElementSibling;
                if (next && /^[UO]L$/i.test(next.tagName)) {
                    var wrapper = document.createElement('div');
                    wrapper.classList.add('analysis-label-block');
                    block.replaceWith(wrapper);
                    wrapper.appendChild(block);
                    wrapper.appendChild(next);
                    block.classList.remove('analysis-label-block');
                } else {
                    block.classList.add('analysis-label-block');
                }
            }
        });
        document.querySelectorAll('.prose h2, .prose h3').forEach(function(heading) {
            if (heading.dataset.enhanced) return;
            var raw = heading.textContent.trim().replace(/:$/, '').replace(/^\d+\.\s*/, '');
            var icon = labels[raw];
            if (!icon) return;
            heading.dataset.enhanced = 'true';
            var content = [];
            var sibling = heading.nextElementSibling;
            while (sibling && !/^H[1-3]$/i.test(sibling.tagName)) {
                content.push(sibling);
                sibling = sibling.nextElementSibling;
            }
            var wrapper = document.createElement('div');
            wrapper.classList.add('analysis-label-block');
            var firstIsP = content.length && content[0].tagName === 'P';
            var label = document.createElement('p');
            label.innerHTML = '<strong>' + icon + ' ' + raw + '</strong>' + (firstIsP ? ': ' + content[0].innerHTML : '');
            wrapper.appendChild(label);
            if (firstIsP) content[0].remove();
            for (var i = firstIsP ? 1 : 0; i < content.length; i++) wrapper.appendChild(content[i]);
            heading.replaceWith(wrapper);
        });
    }
    enhanceAnalysisBlocks();
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
